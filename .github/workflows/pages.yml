name: Publish widget to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare widget
        run: |
          mkdir -p _site/src
          cp src/grist-widget.html _site/src/grist-widget.html
          python3 -c 'import os, pathlib; p = pathlib.Path("_site/src/grist-widget.html"); s = p.read_text(); marker = "__WIDGET_COMMIT__"; assert s.count(marker) == 1; p.write_text(s.replace(marker, os.environ["GITHUB_SHA"]))'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
